<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyCast</title>
    <script>
      // Set the theme before the page paints so dark mode never flashes light.
      (function () {
        var savedPreference = null

        try {
          savedPreference = localStorage.getItem('skycast-theme')
        } catch (error) {
          savedPreference = null // Storage can be blocked by browser settings.
        }

        var followSystem = savedPreference !== 'light' && savedPreference !== 'dark'

        if (followSystem) {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = prefersDark ? 'dark' : 'light'
          return
        }

        document.documentElement.dataset.theme = savedPreference
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
